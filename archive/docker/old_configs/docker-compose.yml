services:
  puppy_ros:
    build: .
    container_name: puppy_ros_dev
    network_mode: "host"  # Use host network for ROS
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
    volumes:
      - ./puppy:/workspace/src/puppy:rw
      - ./puppy_base:/workspace/src/puppy_base:rw
      - ./puppy_bringup:/workspace/src/puppy_bringup:rw
      - ./puppy_camera:/workspace/src/puppy_camera:rw
      - ./puppy_config:/workspace/src/puppy_config:rw
      - ./puppy_description:/workspace/src/puppy_description:rw
      - ./puppy_gazebo:/workspace/src/puppy_gazebo:rw
      - ./puppy_msgs:/workspace/src/puppy_msgs:rw
      - ./puppy_navigation:/workspace/src/puppy_navigation:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
      - /dev:/dev:rw  # For hardware access
    privileged: true  # Needed for hardware access
    devices:
      - /dev/input/js0:/dev/input/js0  # For joystick access
    command: bash -c "source /opt/ros/noetic/setup.bash && 
             cd /workspace &&
             catkin init &&
             catkin config --extend /opt/ros/noetic &&
             (roscore & sleep 5 &&
             catkin build &&
             source devel/setup.bash &&
             roslaunch puppy_base enhanced_walking.launch --screen)"