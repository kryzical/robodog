controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lf_joint1_position_controller:
      type: position_controllers/JointPositionController
    lf_joint2_position_controller:
      type: position_controllers/JointPositionController
    lb_joint1_position_controller:
      type: position_controllers/JointPositionController
    lb_joint2_position_controller:
      type: position_controllers/JointPositionController
    rf_joint1_position_controller:
      type: position_controllers/JointPositionController
    rf_joint2_position_controller:
      type: position_controllers/JointPositionController
    rb_joint1_position_controller:
      type: position_controllers/JointPositionController
    rb_joint2_position_controller:
      type: position_controllers/JointPositionController

lf_joint1_position_controller:
  ros__parameters:
    joint: lf_joint1
lf_joint2_position_controller:
  ros__parameters:
    joint: lf_joint2
lb_joint1_position_controller:
  ros__parameters:
    joint: lb_joint1
lb_joint2_position_controller:
  ros__parameters:
    joint: lb_joint2
rf_joint1_position_controller:
  ros__parameters:
    joint: rf_joint1
rf_joint2_position_controller:
  ros__parameters:
    joint: rf_joint2
rb_joint1_position_controller:
  ros__parameters:
    joint: rb_joint1
rb_joint2_position_controller:
  ros__parameters:
    joint: rb_joint2
