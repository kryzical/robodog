# Joint State Controller
joint_state_controller:
  type: "joint_state_controller/JointStateController"
  publish_rate: 50

# Position Controllers
joint1_position_controller:
  type: "position_controllers/JointPositionController"
  joint: lf_hip_joint
joint2_position_controller:
  type: "position_controllers/JointPositionController"
  joint: lf_upper_leg_joint
joint3_position_controller:
  type: "position_controllers/JointPositionController"
  joint: lf_lower_leg_joint
joint4_position_controller:
  type: "position_controllers/JointPositionController"
  joint: rf_hip_joint
joint5_position_controller:
  type: "position_controllers/JointPositionController"
  joint: rf_upper_leg_joint
joint6_position_controller:
  type: "position_controllers/JointPositionController"
  joint: rf_lower_leg_joint
joint7_position_controller:
  type: "position_controllers/JointPositionController"
  joint: lh_hip_joint
joint8_position_controller:
  type: "position_controllers/JointPositionController"
  joint: lh_upper_leg_joint
joint9_position_controller:
  type: "position_controllers/JointPositionController"
  joint: lh_lower_leg_joint
joint10_position_controller:
  type: "position_controllers/JointPositionController"
  joint: rh_hip_joint
joint11_position_controller:
  type: "position_controllers/JointPositionController"
  joint: rh_upper_leg_joint
joint12_position_controller:
  type: "position_controllers/JointPositionController"
  joint: rh_lower_leg_joint

"":
  joint_states_controller:
      type: joint_state_controller/JointStateController
      publish_rate: 200

  joint_group_position_controller:
      type: effort_controllers/JointTrajectoryController
      joints:
          - lf_hip_joint
          - lf_upper_leg_joint
          - lf_lower_leg_joint
          - rf_hip_joint
          - rf_upper_leg_joint
          - rf_lower_leg_joint
          - lh_hip_joint
          - lh_upper_leg_joint
          - lh_lower_leg_joint
          - rh_hip_joint
          - rh_upper_leg_joint
          - rh_lower_leg_joint

      gains:
        lf_hip_joint        : {p: 180, d: 0.9, i: 20}
        lf_upper_leg_joint  : {p: 180, d: 0.9, i: 20}
        lf_lower_leg_joint  : {p: 180, d: 0.9, i: 20}
        rf_hip_joint        : {p: 180, d: 0.9, i: 20}
        rf_upper_leg_joint  : {p: 180, d: 0.9, i: 20}
        rf_lower_leg_joint  : {p: 180, d: 0.9, i: 20}
        lh_hip_joint        : {p: 180, d: 0.9, i: 20}
        lh_upper_leg_joint  : {p: 180, d: 0.9, i: 20}
        lh_lower_leg_joint  : {p: 180, d: 0.9, i: 20}
        rh_hip_joint        : {p: 180, d: 0.9, i: 20}
        rh_upper_leg_joint  : {p: 180, d: 0.9, i: 20}
        rh_lower_leg_joint  : {p: 180, d: 0.9, i: 20}

      constraints:
          goal_time: 0.5
          stopped_velocity_tolerance: 0.02

      state_publish_rate:  25
      action_monitor_rate: 30
      stop_trajectory_duration: 0.5