# Robot joint damping and friction
gazebo_ros:
  joint_configs:
    damping: 0.5
    friction: 0.5
    
  # Robot foot contact parameters
  foot_contact:
    stiffness: 10000.0
    damping: 100.0
    max_force: 500.0
    min_depth: 0.0001
    surface_radius: 0.01
    
  # Robot mass and inertia scaling
  dynamics:
    mass_scaling: 1.0
    inertia_scaling: 1.0
    
  # Simulation step settings
  physics:
    max_step_size: 0.001
    min_step_size: 0.0001
    real_time_factor: 1.0
    real_time_update_rate: 1000.0