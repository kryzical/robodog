robodog_joint_controller:
  type: "gazebo_ros_control/DefaultRobotHWSim"
  joints:
    - lf_hip_joint
    - lf_upper_leg_joint
    - lf_lower_leg_joint
    - rf_hip_joint
    - rf_upper_leg_joint
    - rf_lower_leg_joint
    - lh_hip_joint
    - lh_upper_leg_joint
    - lh_lower_leg_joint
    - rh_hip_joint
    - rh_upper_leg_joint
    - rh_lower_leg_joint

  constraints:
    goal_time: 0.5
    lf_hip_joint:
      goal: 0.1
      trajectory: 0.2
    lf_upper_leg_joint:
      goal: 0.1
      trajectory: 0.2
    lf_lower_leg_joint:
      goal: 0.1
      trajectory: 0.2
    rf_hip_joint:
      goal: 0.1
      trajectory: 0.2
    rf_upper_leg_joint:
      goal: 0.1
      trajectory: 0.2
    rf_lower_leg_joint:
      goal: 0.1
      trajectory: 0.2
    lh_hip_joint:
      goal: 0.1
      trajectory: 0.2
    lh_upper_leg_joint:
      goal: 0.1
      trajectory: 0.2
    lh_lower_leg_joint:
      goal: 0.1
      trajectory: 0.2
    rh_hip_joint:
      goal: 0.1
      trajectory: 0.2
    rh_upper_leg_joint:
      goal: 0.1
      trajectory: 0.2
    rh_lower_leg_joint:
      goal: 0.1
      trajectory: 0.2