puppy:
  # Position Controllers ---------------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 100

  # Front hip controllers - moderate gains
  joint1_position_controller:
    type: effort_controllers/JointPositionController
    joint: rf_joint1
    pid: {p: 50.0, i: 0.1, d: 5.0, i_clamp_min: -1000, i_clamp_max: 1000}

  joint2_position_controller:
    type: effort_controllers/JointPositionController
    joint: lf_joint1
    pid: {p: 50.0, i: 0.1, d: 5.0, i_clamp_min: -1000, i_clamp_max: 1000}

  # Back hip controllers - extreme gains
  joint3_position_controller:
    type: effort_controllers/JointPositionController
    joint: rb_joint1
    pid: {p: 500.0, i: 1.0, d: 50.0, i_clamp_min: -1000, i_clamp_max: 1000}

  joint4_position_controller:
    type: effort_controllers/JointPositionController
    joint: lb_joint1
    pid: {p: 500.0, i: 1.0, d: 50.0, i_clamp_min: -1000, i_clamp_max: 1000}

  # Front knee controllers
  joint5_position_controller:
    type: effort_controllers/JointPositionController
    joint: rf_joint2
    pid: {p: 50.0, i: 0.1, d: 5.0, i_clamp_min: -1000, i_clamp_max: 1000}

  joint6_position_controller:
    type: effort_controllers/JointPositionController
    joint: lf_joint2
    pid: {p: 50.0, i: 0.1, d: 5.0, i_clamp_min: -1000, i_clamp_max: 1000}

  # Back knee controllers - extreme gains
  joint7_position_controller:
    type: effort_controllers/JointPositionController
    joint: rb_joint2
    pid: {p: 800.0, i: 1.0, d: 80.0, i_clamp_min: -1000, i_clamp_max: 1000}

  joint8_position_controller:
    type: effort_controllers/JointPositionController
    joint: lb_joint2
    pid: {p: 800.0, i: 1.0, d: 80.0, i_clamp_min: -1000, i_clamp_max: 1000}