version: '3'
services:
  puppy_ros:
    # Using the official ROS Noetic image
    image: osrf/ros:noetic-desktop-full
    # Consistent container name used in scripts
    container_name: puppy_ros_dev_gazebo
    # Host network for ROS communication
    network_mode: "host"
    # Environment variables for GUI and ROS
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_HOSTNAME=localhost
      - ROS_MASTER_URI=http://localhost:11311
    # Mount volumes for all ROS packages and required system access
    volumes:
      # ROS packages
      - ./puppy:/workspace/src/puppy:rw
      - ./puppy_base:/workspace/src/puppy_base:rw
      - ./puppy_bringup:/workspace/src/puppy_bringup:rw
      - ./puppy_camera:/workspace/src/puppy_camera:rw
      - ./puppy_config:/workspace/src/puppy_config:rw
      - ./puppy_description:/workspace/src/puppy_description:rw
      - ./puppy_gazebo:/workspace/src/puppy_gazebo:rw
      - ./puppy_msgs:/workspace/src/puppy_msgs:rw
      - ./puppy_navigation:/workspace/src/puppy_navigation:rw
      - ./puppy_ui:/workspace/src/puppy_ui:rw
      - ./puppy_joypad:/workspace/src/puppy_joypad:rw
      # Controller scripts
      - ./controllers:/workspace/controllers:rw
      # System access for display and devices
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
      - /dev:/dev:rw
    # Needed for hardware access
    privileged: true
    # Map joystick device
    devices:
      - /dev/input/js0:/dev/input/js0
    # Startup command to install dependencies, build workspace, and launch simulation
    command: >
      bash -c "apt-get update && apt-get install -y 
      python3-pip 
      python3-catkin-tools 
      ros-noetic-joint-state-publisher 
      ros-noetic-robot-state-publisher 
      ros-noetic-gazebo-ros 
      ros-noetic-gazebo-ros-control 
      ros-noetic-ros-control 
      ros-noetic-ros-controllers 
      ros-noetic-joy 
      python3-opencv &&
      pip3 install numpy scipy transforms3d &&
      source /opt/ros/noetic/setup.bash &&
      cd /workspace &&
      catkin init &&
      catkin config --extend /opt/ros/noetic &&
      (roscore & sleep 5 &&
      catkin build &&
      source devel/setup.bash &&
      roslaunch puppy_ui puppypi_joystick_ui.launch --screen)" 