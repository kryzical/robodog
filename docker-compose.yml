version: '3'

services:
  # Main simulation service
  simulation:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: puppy_robot_simulation
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./puppy_description:/ros_ws/src/puppy_description
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /ros_ws
    command: bash -c "cd /ros_ws && catkin config --extend /opt/ros/noetic && catkin build && source /opt/ros/noetic/setup.bash && source /ros_ws/devel/setup.bash && roslaunch puppy_description gazebo.launch"

  # Development environment service (for interactive development)
  dev:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: puppy_robot_dev
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./puppy_description:/ros_ws/src/puppy_description
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /ros_ws
    command: bash -c "cd /ros_ws && catkin config --extend /opt/ros/noetic && catkin build && source /opt/ros/noetic/setup.bash && source /ros_ws/devel/setup.bash && bash"

  # RViz visualization only (lighter weight)
  rviz:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: puppy_robot_rviz
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./puppy_description:/ros_ws/src/puppy_description
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /ros_ws
    command: bash -c "cd /ros_ws && catkin config --extend /opt/ros/noetic && catkin build && source /opt/ros/noetic/setup.bash && source /ros_ws/devel/setup.bash && roslaunch puppy_description display.launch" 