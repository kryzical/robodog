name: robodog

services:
  gazebo:
    image: docker_gazebo
    container_name: gazebo_robot
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - GZ_SIM_RESOURCE_PATH=/workspace/src:/workspace/models
      - IGN_GAZEBO_RESOURCE_PATH=/workspace/src:/workspace/models
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      - ../puppy_ros2_ws:/workspace:rw
      - ../launch/launch-with-robot.sh:/launch.sh:ro
    command: ["/bin/bash", "/launch.sh"]

