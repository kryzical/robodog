version: '3.8'

services:
  terminal:
    container_name: puppy_terminal
    image: ghcr.io/${GITHUB_USERNAME:-yourusername}/puppy_terminal:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - GAZEBO_VERSION=${GAZEBO_VERSION}
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ROS_DISTRO=${ROS_DISTRO}
      - GAZEBO_VERSION=${GAZEBO_VERSION}
    volumes:
      # X11 display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority
      # Workspace source
      - ../puppy_ros2_ws:/workspace/puppy_ros2_ws:rw
    command: >
      bash -c "
        cd /workspace/puppy_ros2_ws && \
        source /opt/ros/${ROS_DISTRO}/setup.bash && \
        if [ ! -d 'install' ]; then
          echo 'First time setup: Building workspace...' && \
          colcon build --symlink-install && \
          source install/setup.bash
        else
          source install/setup.bash
        fi && \
        /bin/bash
      "
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  simulation:
    container_name: puppy_simulation
    image: puppy_ros2:latest
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ROS_DISTRO=${ROS_DISTRO}
      - GAZEBO_VERSION=${GAZEBO_VERSION}
    volumes:
      # X11 display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Workspace source
      - ../puppy_ros2_ws:/workspace/puppy_ros2_ws:rw
    command: >
      bash -c "
        cd /workspace/puppy_ros2_ws && \
        source /opt/ros/${ROS_DISTRO}/setup.bash && \
        rm -rf build install log && \
        colcon build --symlink-install && \
        source install/setup.bash && \
        ros2 launch puppy_description controlled_robot.launch.py
      "
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 