version: '3.8'

services:
  terminal:
    container_name: puppy_terminal
    image: ghcr.io/${GITHUB_USERNAME:-yourusername}/puppy_terminal:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - GAZEBO_VERSION=${GAZEBO_VERSION}
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ROS_DISTRO=${ROS_DISTRO}
      - GAZEBO_VERSION=${GAZEBO_VERSION}
    volumes:
      # X11 display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority
      # Workspace
      - ${WORKSPACE_PATH}:/workspace:rw
    command: >
      bash -c "
        cd /workspace && \
        source /opt/ros/${ROS_DISTRO}/setup.bash && \
        source /workspace/install/setup.bash && \
        /bin/bash
      "
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  simulation:
    container_name: puppy_simulation
    image: ghcr.io/${GITHUB_USERNAME:-yourusername}/puppy_simulation:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - GAZEBO_VERSION=${GAZEBO_VERSION}
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - ROS_DISTRO=${ROS_DISTRO}
      - GAZEBO_VERSION=${GAZEBO_VERSION}
      - GAZEBO_MODEL_PATH=${GAZEBO_MODEL_PATH}
      - GAZEBO_RESOURCE_PATH=${GAZEBO_RESOURCE_PATH}
      - IGN_GAZEBO_RESOURCE_PATH=${IGN_GAZEBO_RESOURCE_PATH}
      - IGN_GAZEBO_SYSTEM_PLUGIN_PATH=${IGN_GAZEBO_SYSTEM_PLUGIN_PATH}
    volumes:
      # X11 display
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:/root/.Xauthority
      # Workspace
      - ${WORKSPACE_PATH}:/workspace:rw
    command: >
      bash -c "
        source /opt/ros/${ROS_DISTRO}/setup.bash && \
        source /workspace/install/setup.bash && \
        cd /workspace && \
        ign gazebo -v 4 -r /workspace/src/puppy_description/sdf/puppy_world.sdf
      "
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3" 