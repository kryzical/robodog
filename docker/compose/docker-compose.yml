version: '3'
services:
  ros2_base:
    build:
      context: ../..
      dockerfile: .Dockerfile/humble/Dockerfile
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
    volumes:
      - ../..:/ros_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.Xauthority:/root/.Xauthority:rw
    devices:
      - /dev/video0:/dev/video0
      - /dev/vchiq:/dev/vchiq
      - /dev/ttyAMA0:/dev/ttyAMA0
    command: tail -f /dev/null  # Keeps container running

  camera_node:
    extends: ros2_base
    command: bash -c "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash && ros2 run puppy_camera camera_publisher.py"
    depends_on:
      - ros2_base

  controller:
    extends: ros2_base
    command: bash -c "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash && ros2 launch puppypi_control controller.launch.py"
    depends_on:
      - ros2_base

  gazebo:
    extends: ros2_base
    command: bash -c "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash && ros2 launch puppy_gazebo robot.launch.py"
    depends_on:
      - ros2_base

  rviz:
    extends: ros2_base
    command: bash -c "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash && ros2 run rviz2 rviz2"
    depends_on:
      - ros2_base

  dev:
    extends: ros2_base
    command: bash
    stdin_open: true
    tty: true 